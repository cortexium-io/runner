name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Process core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          workload: race
      - name: Test
        # Real command journeys compile isolated fixtures with fresh caches.
        # This package watchdog leaves Runner's command/process limits intact.
        run: go test -race -timeout 20m ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/cortexium-runner
