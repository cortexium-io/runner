name: Set up Go with a refreshed workload cache
description: Use the repository Go version and retain successful jobs' updated build and module caches.
inputs:
  workload:
    description: Build mode (race or test); readiness shares race to seed main's cache for PRs.
    required: true
runs:
  using: composite
  steps:
    - name: Set up Go
      id: go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Locate Go caches
      id: paths
      shell: bash
      run: |
        printf 'build=%s\n' "$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        printf 'modules=%s\n' "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        printf 'image=%s\n' "${ImageOS:-$RUNNER_OS}" >> "$GITHUB_OUTPUT"
    # GitHub enforces branch/PR cache visibility. Restore only this workload,
    # platform, toolchain and dependency set; never use a cross-workload fallback.
    # A new key lets the action save added build entries after a successful job.
    - name: Restore and refresh Go caches
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ${{ steps.paths.outputs.build }}
          ${{ steps.paths.outputs.modules }}
        key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.image }}-${{ steps.go.outputs.go-version }}-${{ inputs.workload }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.image }}-${{ steps.go.outputs.go-version }}-${{ inputs.workload }}-${{ hashFiles('go.mod', 'go.sum') }}-
