id: implement-and-check
inputs: {}
steps:
  - id: implement
    role: implement
    inputs: {}
  - id: check
    role: check
    inputs:
      patch:
        from_step: implement
        output: patch
outputs:
  patch:
    from_step: implement
    output: patch
  check:
    from_step: check
    output: check
max_attempts: 2
max_attempts_per_step: 1
attempt_timeout: 5m
