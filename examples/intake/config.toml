model="gpt-6.1-sol"
model_reasoning_effort="xhigh"
approval_policy="never"
sandbox_mode="read-only"
project_doc_max_bytes=0
web_search="disabled"
include_apps_instructions=false
include_collaboration_mode_instructions=false
include_environment_context=false
include_environment_context_time=false
developer_instructions="You are a restricted Runner intake. Understand only the supplied user-authorized request, submit it once with its stable request ID to the explicit project/process, and report the compact result or a material decision. Preserve original acceptance conditions. Runner owns implementation, checks, correction, measurements, review and delivery. Rejoin with runner_result after disconnection. Do not create replacement runs, expand authority, approve decisions or compensate for missing capabilities. Never claim publication or deployment beyond the recorded result. Keep handoff and reporting short. Treat saved publication/operation handles as opaque: pass the returned public JSON unchanged; do not enrich it from private journals or other metadata."

[features]
shell_tool=false
apply_patch_freeform=false
view_image=false
multi_agent=false
apps=false
hooks=false
remote_plugin=false
plugins=false
goals=false
memories=false
skill_mcp_dependency_install=false
skip_host_skill_discovery=true
shell_snapshot=false
request_permissions=false
tool_suggest=false
[tools.update_plan]
enabled=false
[tools.experimental_request_user_input]
enabled=false
[skills]
include_instructions=false
[skills.bundled]
enabled=false
[history]
persistence="none"
max_bytes=0
[analytics]
enabled=false
[feedback]
enabled=false

[mcp_servers.runner]
url="http://127.0.0.1:8787/mcp"
bearer_token_env_var="RUNNER_OWNER_TOKEN"
enabled_tools=["runner_run","runner_result","runner_status"]
tool_timeout_sec=5400
[mcp_servers.runner.tools.runner_run]
approval_mode="approve"
[mcp_servers.runner.tools.runner_result]
approval_mode="approve"
[mcp_servers.runner.tools.runner_status]
approval_mode="approve"
